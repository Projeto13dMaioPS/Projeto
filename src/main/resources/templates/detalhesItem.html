<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Obra - Acervo Digital</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }
        header { background: #1976d2; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; }
        .sidebar { width: 220px; background: white; height: 100vh; float: left; border-right: 1px solid #ddd; padding-top: 20px; position: fixed; }
        .sidebar a { display: block; padding: 15px 20px; color: #333; text-decoration: none; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #f0f0f0; border-left-color: #1976d2; font-weight: bold; }
        .content { margin-left: 220px; padding: 30px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 30px; display: flex; gap: 30px; border: 1px solid #eee; }
        .img-block { width: 350px; flex-shrink: 0; }
        .obra-img { width: 100%; border-radius: 8px; background: #eaeaea; }
        .info-block { flex-grow: 1; }
        .btn { padding: 10px 20px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; border: none; cursor: pointer; display: inline-block; }
        .btn-primary { background: #1976d2; color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-danger { background: #feebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>
<header>
    <div style="font-size: 18px; font-weight: bold;">Acervo Digital</div>
    <div class="header-links">
        <a href="/">Catálogo</a>
        <a href="/usuario/logout">Sair</a>
    </div>
</header>
<div class="sidebar">
    <a href="/">Catálogo</a>
    <a href="/favoritos" th:if="${session.usuarioLogado != null}">Favoritos</a>
</div>
<div class="content">
    <div class="card">
        <div class="img-block">
            <img th:if="${item.imagemEmBase64 != null}" th:src="${item.imagemEmBase64}" class="obra-img">
            <div th:unless="${item.imagemEmBase64 != null}" style="height: 300px; background: #eee; display: flex; align-items: center; justify-content: center; border-radius: 8px;">Sem Imagem</div>
        </div>
        <div class="info-block">
            <h1 th:text="${item.nome}" style="margin-top: 0; color: #1976d2;"></h1>
            <p><strong>Tipo:</strong> <span th:text="${item.tipo}"></span></p>
            <p><strong>Autor:</strong> <span th:text="${item.autor}"></span></p>
            <p><strong>ISBN:</strong> <span th:text="${item.isbn}"></span></p>
            <p><strong>Edição:</strong> <span th:text="${item.edicao}"></span></p>
            <p><strong>Descrição:</strong> <span th:text="${item.descricaoBreve}"></span></p>

            <div style="margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap;">
                <a th:href="${(session.usuarioLogado != null and session.usuarioLogado.tipo.name() == 'ADMINISTRADOR') ? '/itemAcervo/dashboard' : '/'}" class="btn btn-secondary">Voltar</a>

                <form th:action="@{/favoritos/adicionar/{id}(id=${item.id})}" method="post">
                    <button type="submit" class="btn btn-primary">Favoritar</button>
                </form>
                <div th:if="${session.usuarioLogado != null and session.usuarioLogado.tipo.name() == 'ADMINISTRADOR'}" style="display:flex; gap:10px;">
                    <a th:href="@{/itemAcervo/editar/{id}(id=${item.id})}" class="btn btn-primary">Editar</a>
                    <form th:action="@{/itemAcervo/excluir/{id}(id=${item.id})}" method="post" onsubmit="return confirm('Confirmar exclusão?');">
                        <button type="submit" class="btn btn-danger">Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
