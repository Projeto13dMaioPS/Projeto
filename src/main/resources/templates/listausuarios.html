<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Usuários - Acervo Digital</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }
        header { background: #1976d2; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; }
        .sidebar { width: 220px; background: white; height: 100vh; float: left; border-right: 1px solid #ddd; padding-top: 20px; position: fixed; }
        .sidebar a { display: block; padding: 15px 20px; color: #333; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background: #f0f0f0; border-left: 4px solid #1976d2; font-weight: bold; }
        .content { margin-left: 220px; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .card-body { padding: 20px; flex-grow: 1; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 15px; border-top: 1px solid #eee; }
        .btn { padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; text-align: center; border: none; cursor: pointer; font-weight: 600; display: block; width: 100%; box-sizing: border-box; }
        .btn-blue { background: #1976d2; color: white; }
        .btn-red { background: #feebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>
<header>
    <div style="font-size: 18px; font-weight: bold;">Acervo Digital</div>
    <div class="header-links">
        <a href="/">Ir para Catálogo</a>
        <a href="/usuario/logout">Sair</a>
    </div>
</header>
<div class="sidebar">
    <a href="/usuario/dashboard/usuarios" class="active">Usuarios</a>
    <a href="/itemAcervo/dashboard">Acervo</a>
</div>
<div class="content">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Gerenciar Usuários</h2>
        <a href="/usuario/dashboard/usuarios/novo" class="btn btn-blue" style="width: auto; padding: 10px 20px;">+ Novo Usuário</a>
    </div>

    <div th:if="${sucesso}" style="background: #d4edda; color: #155724; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
        <span th:text="${sucesso}"></span>
    </div>

    <div class="grid">
        <div class="card" th:each="u : ${usuarios}">
            <div class="card-body">
                <h3 style="margin: 0 0 5px 0; font-size: 20 px;" th:text="${u.nome}">Nome do Usuário</h3>
                <h3 style="margin: 0 0 10px 0; font-size: 16px;" th:text="${u.email}"></h3>
                <p style="margin: 5px 0; font-size: 13px; color: #666;"><strong>Tipo:</strong> <span th:text="${u.tipo}"></span></p>
            </div>
            <div class="actions">
                <a th:href="@{/usuario/dashboard/usuarios/editar/{id}(id=${u.id})}" class="btn btn-blue">Editar</a>
                <form th:action="@{/usuario/dashboard/usuarios/deletar/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Excluir este usuário?');">
                    <button type="submit" class="btn btn-red">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
