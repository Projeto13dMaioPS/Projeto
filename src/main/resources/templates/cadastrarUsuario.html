<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário - Acervo Digital</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }
        .content { margin: 50px auto; width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-blue { background: #1976d2; color: white; }
    </style>
</head>
<body>
<div class="content">
    <h2>Cadastrar Novo Usuário</h2>
    <form th:action="@{/usuario/dashboard/usuarios/salvar}" th:object="${usuario}" method="post">

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" th:field="*{nome}" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" th:field="*{senha}" required>
        </div>

        <div class="form-group">
            <label>Tipo de Acesso</label>
            <select th:field="*{tipo}">
                <option value="USUARIO">USUARIO</option>
                <option value="ADMINISTRADOR">ADMINISTRADOR</option>
            </select>
        </div>

        <button type="submit" class="btn btn-blue">Cadastrar</button>
        <a href="/usuario/dashboard/usuarios" style="display:block; text-align:center; margin-top:10px; color:#666;">Voltar</a>
    </form>
</div>
</body>
</html>
