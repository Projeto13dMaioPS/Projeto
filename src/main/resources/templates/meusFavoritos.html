<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Favoritos - Acervo Digital</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }
        header { background: #1976d2; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; }
        .sidebar { width: 220px; background: white; height: 100vh; float: left; border-right: 1px solid #ddd; padding-top: 20px; position: fixed; }
        .sidebar a { display: block; padding: 15px 20px; color: #333; text-decoration: none; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #f0f0f0; border-left-color: #1976d2; font-weight: bold; }
        .content { margin-left: 220px; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #eee; }
        .card-img { width: 100%; height: 250px; object-fit: cover; background: #eaeaea; }
        .card-body { padding: 20px; flex-grow: 1; }
        .card-title { font-size: 20px; margin: 0 0 10px 0; color: #1976d2; font-weight: bold; }
        .card-info { margin: 8px 0; font-size: 14px; color: #555; }
        .card-actions { padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fafafa; }
        .btn { padding: 10px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; text-align: center; font-weight: 600; border: none; cursor: pointer; flex: 1; }
        .btn-detalhes { background: #e0e0e0; color: #333; }
        .btn-remover { background: #d32f2f; color: white; }
        .btn-explorar { background: #1976d2; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 15px; transition: background 0.3s; }
        .btn-explorar:hover { background: #1565c0; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 5px; text-align: center; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<header>
    <div style="font-size: 18px; font-weight: bold;">Acervo Digital</div>
    <div class="header-links">
        <a href="/">Ir para Catálogo</a>
        <a href="/usuario/logout">Sair</a>
    </div>
</header>
<div class="sidebar">
    <a href="/">Catálogo</a>
    <a href="/favoritos" class="active">Meus Favoritos</a>
</div>
<div class="content">
    <h2 style="margin-top: 0;">Meus Favoritos</h2>

    <div th:if="${aviso}" class="alert alert-error" th:text="${aviso}"></div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

    <div th:if="${#lists.isEmpty(favoritos)}" style="background: white; padding: 40px; border-radius: 8px; border: 1px solid #ddd; text-align: center;">
        <p style="font-size: 18px; color: #555; margin: 0;">Você ainda não tem itens favoritos.</p>
        <a href="/" class="btn-explorar">Explorar Catálogo</a>
    </div>

    <div class="grid">
        <div class="card" th:each="fav : ${favoritos}" th:if="${fav.itemAcervo != null}">
            <img th:if="${fav.itemAcervo.imagemEmBase64 != null}" th:src="${fav.itemAcervo.imagemEmBase64}" class="card-img">
            <div class="card-body">
                <h3 class="card-title" th:text="${fav.itemAcervo.nome}"></h3>
                <div class="card-info"><strong>Autor:</strong> <span th:text="${fav.itemAcervo.autor}"></span></div>
            </div>
            <div class="card-actions">
                <a th:href="@{/itemAcervo/acessarItem/{id}(id=${fav.itemAcervo.id})}" class="btn btn-detalhes">Detalhes</a>
                <form th:action="@{/favoritos/remover/{id}(id=${fav.itemAcervo.id})}" method="post" style="flex:1;">
                    <button type="submit" class="btn btn-remover">Remover</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
