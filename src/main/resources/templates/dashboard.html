<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento - Acervo Digital</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }
        header { background: #1976d2; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; }
        .sidebar { width: 220px; background: white; height: 100vh; float: left; border-right: 1px solid #ddd; padding-top: 20px; position: fixed; }
        .sidebar a { display: block; padding: 15px 20px; color: #333; text-decoration: none; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #f0f0f0; border-left-color: #1976d2; font-weight: bold; }
        .content { margin-left: 220px; padding: 30px; }
        .search-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-row { display: flex; gap: 15px; align-items: flex-end; }
        .form-group { flex-grow: 1; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; flex-grow: 1; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 15px; border-top: 1px solid #eee; }
        .btn { padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; text-align: center; border: none; cursor: pointer; font-weight: 600; display: block; width: 100%; box-sizing: border-box; }
        .btn-blue { background: #1976d2; color: white; }
        .btn-red { background: #feebee; color: #c62828; border: 1px solid #ffcdd2; }
        .btn-gray { background: #e0e0e0; color: #333; }
    </style>
</head>
<body>
<header>
    <div style="font-size: 18px; font-weight: bold;">Acervo Digital</div>
    <div class="header-links">
        <a href="/">Ir para Catálogo</a>
        <a href="/usuario/logout">Sair</a>
    </div>
</header>
<div class="sidebar">
    <a href="/usuario/dashboard/usuarios" th:if="${session.usuarioLogado != null and session.usuarioLogado.tipo.name() == 'ADMINISTRADOR'}">Usuarios</a>
    <a href="/itemAcervo/dashboard" class="active">Acervo</a>
</div>
<div class="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Gerenciar Acervo</h2>
        <a href="/itemAcervo/novo" class="btn btn-blue" style="width: auto; padding: 10px 20px;">+ Adicionar Item</a>
    </div>
    <div class="search-box">
        <form th:action="@{/itemAcervo/dashboard}" method="get" class="form-row">
            <div class="form-group">
                <label style="font-size: 12px; font-weight: bold;">Pesquisar</label>
                <input type="text" name="termo" th:value="${termo}" placeholder="Nome ou Autor...">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: bold;">Tipo</label>
                <select name="tipo">
                    <option value="">Todos</option>
                    <option th:each="t : ${T(com.example.projetos_tm.model.TipoItem).values()}"
                            th:value="${t}" th:text="${t}" th:selected="${t == tipo}"></option>
                </select>
            </div>
            <div>
                <label style="font-size: 12px; font-weight: bold;">Status</label>
                <select name="ativo">
                    <option value="">Todos</option>
                    <option value="true" th:selected="${ativo != null and ativo == true}">Ativo</option>
                    <option value="false" th:selected="${ativo != null and ativo == false}">Inativo</option>
                </select>
            </div>
            <button type="submit" class="btn btn-blue" style="width: auto;">Filtrar</button>
            <a href="/itemAcervo/dashboard" class="btn btn-gray" style="width: auto; text-decoration: none;">Limpar</a>
        </form>
    </div>
    <div class="grid">
        <div class="card" th:each="item : ${itens}">
            <img th:if="${item.imagemEmBase64 != null}" th:src="${item.imagemEmBase64}" class="card-img">
            <div class="card-body">
                <h3 style="margin: 0 0 10px 0; font-size: 16px;" th:text="${item.nome}"></h3>
                <p style="margin: 5px 0; font-size: 13px; color: #666;"><strong>Tipo:</strong> <span th:text="${item.tipo}"></span></p>
                <p style="margin: 5px 0; font-size: 13px; color: #666;"><strong>Status:</strong> <span th:text="${item.ativo} ? 'Ativo' : 'Inativo'"></span></p>
            </div>
            <div class="actions">
                <a th:href="@{/itemAcervo/acessarItem/{id}(id=${item.id})}" class="btn btn-blue">Detalhes</a>
                <a th:href="@{/itemAcervo/editar/{id}(id=${item.id})}" class="btn btn-blue">Editar</a>
                <form th:if="${item.ativo}" th:action="@{/itemAcervo/desabilitar/{id}(id=${item.id})}" method="post">
                    <button type="submit" class="btn btn-red" style="width: 100%;">Desabilitar</button>
                </form>
                <form th:unless="${item.ativo}" th:action="@{/itemAcervo/reativar/{id}(id=${item.id})}" method="post">
                    <button type="submit" class="btn btn-blue" style="width: 100%;">Reativar</button>
                </form>
                <form th:action="@{/itemAcervo/excluir/{id}(id=${item.id})}" method="post" onsubmit="return confirm('Confirmar exclusão permanente?');" style="grid-column: span 2;">
                    <button type="submit" class="btn btn-red" style="width: 100%;">Excluir Permanente</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
