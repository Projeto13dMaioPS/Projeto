<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f6f9;
        }

        .card-dashboard{
            border: none;
            border-radius: 18px;
            transition: .2s;
        }

        .card-dashboard:hover{
            transform: translateY(-3px);
        }

        .icon-box{
            width:60px;
            height:60px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:16px;
            font-size:26px;
        }

        .table td, .table th{
            vertical-align: middle;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">

        <span class="navbar-brand fw-bold">
            Catálogo do Acervo
        </span>

        <div class="d-flex align-items-center">

            <span class="navbar-text text-white me-3 d-none d-md-inline"
                  th:text="'Logado: ' + ${session.usuarioLogado.email} + ' [' + ${session.usuarioLogado.tipo} + ']'">
            </span>

            <a href="/usuario/logout"
               class="btn btn-danger btn-sm">
                Sair
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    
    <div th:if="${param.error == 'negado'}"
         class="alert alert-danger">
        Acesso negado.
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">Dashboard Biblioteca</h2>
            <p class="text-muted">
                Gerencie itens, reservas e empréstimos.
            </p>
        </div>

        <button class="btn btn-success shadow"
                data-bs-toggle="modal"
                data-bs-target="#novoItemModal">
            + Novo Item
        </button>

    </div>

    <div class="row mb-4">

        <div class="col-md-4 mb-3">
            <div class="card card-dashboard shadow-sm p-3">
                <div class="d-flex align-items-center">

                    <div class="icon-box bg-primary text-white me-3">
                        📚

                    </div>
                    <div>
                        <h6 class="text-muted mb-0">
                            Total de Itens
                        </h6>

                        <h3 class="fw-bold"
                            th:text="${#lists.size(itens)}">
                            0
                        </h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card card-dashboard shadow-sm p-3">
                <div class="d-flex align-items-center">

                    <div class="icon-box bg-success text-white me-3">
                        ✅
                    </div>

                    <div>
                        <h6 class="text-muted">
                            Empréstimos
                        </h6>
                        <h3>12</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card card-dashboard shadow-sm p-3">
                <div class="d-flex align-items-center">

                    <div class="icon-box bg-warning text-white me-3">
                        ⏳
                    </div>

                    <div>
                        <h6 class="text-muted">
                            Reservas
                        </h6>
                        <h3>8</h3>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="row">
                <div class="col-md-8">
                    <input type="text"
                           class="form-control"
                           placeholder="Pesquisar item...">
                </div>

                <div class="col-md-4">
                    <button class="btn btn-primary w-100">
                        Buscar
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow border-0">

        <div class="card-header bg-white">
            <h5 class="fw-bold m-0">
                Itens cadastrados
            </h5>
        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle m-0">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                    <th>Tipo</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="item : ${itens}">

                    <td th:text="${item.id}"></td>

                    <td class="fw-semibold"
                        th:text="${item.nome}">
                    </td>

                    <td th:text="${item.descricao}">
                    </td>

                    <td>

                        <form th:action="@{/reservas/solicitar/{itemId}(itemId=${item.id})}"
                              method="post"
                              class="d-inline">

                            <button class="btn btn-sm btn-primary">
                                Reservar
                            </button>
                        </form>
                        <form th:action="@{/emprestimos/solicitar/{itemId}(itemId=${item.id})}"
                              method="post"
                              class="d-inline">

                            <input type="hidden"
                                   name="dias"
                                   value="7">

                            <button class="btn btn-success btn-sm">
                                Emprestar
                            </button>
                        </form>

                        <a th:href="@{/itens/editar/{id}(id=${item.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/itens/excluir/{id}(id=${item.id})}"
                              method="post"
                              class="d-inline">

                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('Deseja excluir este item?')">
                                Excluir
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <div th:if="${session.usuarioLogado.tipo.name() == 'ADMINISTRADOR'}"
         class="card mt-4 shadow border-0">

        <div class="card-body">
            <h4 class="text-danger fw-bold">
                🛡 Painel Administrador
            </h4>
            <div class="d-flex flex-wrap gap-2 mt-3">
                <button class="btn btn-outline-danger">
                    Configurações
                </button>
                <button class="btn btn-outline-danger">
                    Logs
                </button>

                <button class="btn btn-outline-danger">
                    Gerenciar Categorias
                </button>

                <button class="btn btn-outline-danger">
                    Gerenciar Usuarios
                </button>

            </div>
        </div>
    </div>

</div>

<div class="modal fade"
     id="novoItemModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form action="/itens/salvar"
                  method="post">

                <div class="modal-header">
                    <h5>Novo Item</h5>
                    <button class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <label>Nome</label>
                    <input type="text"
                           name="nome"
                           class="form-control mb-3"
                           required>

                    <label>Descrição</label>
                    <textarea name="descricao"
                              class="form-control"
                              required>
                    </textarea>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="btn btn-success">
                        Salvar
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
