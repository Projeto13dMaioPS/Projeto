<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Biblioteca</title>
</head>
<body>

<header>
    <nav>
        <strong>Catálogo do Acervo</strong>
        <div>
            <span th:text="'Logado: ' + ${session.usuarioLogado.email} + ' [' + ${session.usuarioLogado.tipo} + ']'"></span>
            <a href="/usuario/logout">Sair</a>
        </div>
    </nav>
</header>

<main>
    <p th:if="${param.error == 'negado'}" style="color: red; font-weight: bold;">
        Acesso negado.
    </p>

    <h2>Dashboard Biblioteca</h2>
    <p>Gerencie itens, reservas e empréstimos.</p>

    <a href="#novoItemForm">+ Novo Item</a>

    <hr>

    <section>
        <h3>Resumo</h3>
        <ul>
            <li>Total de Itens: <span th:text="${#lists.size(itens)}">0</span></li>
            <li>Empréstimos: 12</li>
            <li>Reservas: 8</li>
        </ul>
    </section>

    <hr>

    <form>
        <input type="text" placeholder="Pesquisar item...">
        <button type="submit">Buscar</button>


    </form>

    <hr>

    <section>
        <h3>Itens cadastrados</h3>
        <table border="1">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${itens}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.nome}"></td>
                <td th:text="${item.descricao}"></td>
                <td>-</td>
                <td>
                    <form th:action="@{/itemAcervo/acessarItem/{itemId}(itemId=${item.id})}" method="post" style="display:inline;">
                        <button type="submit">Detalhes do Item</button>
                    </form>

                    <a th:href="@{/itens/editar/{id}(id=${item.id})}">Editar</a>

                    <form th:action="@{/itens/excluir/{id}(id=${item.id})}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Deseja excluir este item?')">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section th:if="${session.usuarioLogado.tipo.name() == 'ADMINISTRADOR'}">
        <hr>
        <h4 style="color: red;">🛡 Painel Administrador</h4>
        <button>Configurações</button>
        <button>Logs</button>
        <button>Gerenciar Categorias</button>
        <button>Gerenciar Usuarios</button>
    </section>

    <hr>

    <section id="novoItemForm">
        <h3>Novo Item</h3>
        <form action="/itens/salvar" method="post">
            <p>
                <label>Nome:</label><br>
                <input type="text" name="nome" required>
            </p>
            <p>
                <label>Descrição:</label><br>
                <textarea name="descricao" required></textarea>
            </p>
            <button type="submit">Salvar</button>
        </form>
    </section>

</main>

</body>
</html>
