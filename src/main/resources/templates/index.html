<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Acervo Digital</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }
        header { background: #1976d2; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; }
        .sidebar { width: 220px; background: white; height: 100vh; float: left; border-right: 1px solid #ddd; padding-top: 20px; position: fixed; }
        .sidebar a { display: block; padding: 15px 20px; color: #333; text-decoration: none; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #f0f0f0; border-left-color: #1976d2; font-weight: bold; }
        .content { margin-left: 220px; padding: 30px; }

        .search-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-row { display: flex; gap: 15px; align-items: flex-end; }
        .form-group { flex-grow: 1; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-body { padding: 20px; flex-grow: 1; }
        .card-title { font-size: 18px; margin: 0 0 10px 0; color: #1976d2; }

        .btn { padding: 10px 15px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: 600; border: none; cursor: pointer; text-align: center; }
        .btn-blue { background: #1976d2; color: white; }
        .btn-gray { background: #e0e0e0; color: #333; }

        .alert { padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; text-align: center; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
<header>
    <div style="font-size: 18px; font-weight: bold;">Acervo Digital</div>
    <div class="header-links">
        <a href="/usuario/meu-perfil" th:if="${session.usuarioLogado != null}">Meu Perfil</a>
        <a href="/itemAcervo/dashboard" th:if="${session.usuarioLogado != null and session.usuarioLogado.tipo.name() == 'ADMINISTRADOR'}">Gerenciamento</a>
        <a href="/usuario/login" th:if="${session.usuarioLogado == null}">ENTRAR</a>
        <a href="/usuario/logout" th:if="${session.usuarioLogado != null}">SAIR</a>
    </div>
</header>
<div class="sidebar">
    <a href="/" class="active">Catálogo</a>
    <a href="/favoritos" th:if="${session.usuarioLogado != null}">Favoritos</a>
</div>
<div class="content">
    <h2>Catálogo de Obras</h2>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

    <div class="search-box">
        <form th:action="@{/}" method="get" class="form-row">
            <div class="form-group">
                <label style="font-size: 12px; font-weight: bold;">Pesquisar</label>
                <input type="text" name="termo" th:value="${termo}" placeholder="Nome ou Autor...">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: bold;">Tipo</label>
                <select name="tipo">
                    <option value="">Todos</option>
                    <option th:each="t : ${T(com.example.projetos_tm.model.TipoItem).values()}"
                            th:value="${t}" th:text="${t}" th:selected="${t == tipo}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-blue">Filtrar</button>
            <a href="/" class="btn btn-gray">Limpar</a>
        </form>
    </div>

    <div class="grid">
        <div class="card" th:each="item : ${itens}" th:if="${item.ativo}">
            <img th:if="${item.imagemEmBase64 != null}" th:src="${item.imagemEmBase64}" class="card-img">
            <div class="card-body">
                <h3 class="card-title" th:text="${item.nome}"></h3>
                <p style="font-size: 14px; color: #666;"><strong>Autor:</strong> <span th:text="${item.autor}"></span></p>
            </div>
            <div style="padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px;">
                <a th:href="@{/itemAcervo/acessarItem/{id}(id=${item.id})}" class="btn btn-gray" style="flex:1;">Detalhes</a>
                <form th:action="@{/favoritos/adicionar/{id}(id=${item.id})}" method="post" style="flex:1;">
                    <button type="submit" class="btn btn-blue" style="width: 100%;">Favoritar</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
