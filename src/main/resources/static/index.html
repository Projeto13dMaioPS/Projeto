<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Digital - Catalogo</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f9f9f9; color: #333; }
        header { background: #1976d2; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-weight: bold; font-size: 18px; text-decoration: none; display: flex; gap: 20px; align-items: center; }
        .logo span { opacity: 0.8; font-weight: normal; font-size: 14px; }
        .btn-login { color: white; border: 1px solid white; padding: 8px 16px; text-decoration: none; border-radius: 4px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .header-title { font-size: 24px; margin-bottom: 5px; }
        .header-subtitle { color: #666; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 40px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .search-bar select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; border: 1px solid #eee; display: flex; flex-direction: column; }
        .card-img { height: 200px; background: #ddd; width: 100%; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 16px; margin: 0 0 5px 0; font-weight: bold; }
        .card-author { font-size: 14px; color: #666; margin: 0 0 10px 0; }
        .card-badge { align-self: flex-start; padding: 4px 8px; background: #e3f2fd; color: #1976d2; border-radius: 12px; font-size: 12px; margin-bottom: 10px; }
        .card-actions { margin-top: auto; display: flex; gap: 10px; border-top: 1px solid #eee; padding-top: 15px; }
        .card-actions form { margin: 0; }
        .btn-card { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #e0e0e0; color: #333; }
        .btn-card.primary { background: #1976d2; color: white; }
    </style>
</head>
<body>


<header>
    <div class="logo">
        Acervo Digital
        <span>CATALOGO</span>
    </div>
    <a href="/usuario/login" class="btn-login" th:if="${session.usuarioLogado == null}">ENTRAR</a>
    <a href="/dashboard" class="btn-login" th:if="${session.usuarioLogado != null}">PAINEL</a>
</header>

<div class="container">
    <div class="header-title">Catalogo do Acervo</div>
    <div class="header-subtitle">Explore nossa colecao de <span th:text="${#lists.size(itens)}">0</span> itens</div>

    <form class="search-bar" action="/pesquisar" method="get">
        <input type="text" name="q" placeholder="Buscar por titulo, autor ou descricao...">
        <select name="categoria">
            <option value="">Todas as Categorias</option>
        </select>
        <select name="area">
            <option value="">Todas as Areas</option>
        </select>
        <button type="submit" style="display:none;">Buscar</button>
    </form>

    <div class="grid">
        <div class="card" th:each="item : ${itens}">
            <img th:src="${item.urlImagem != null ? item.urlImagem : 'https://via.placeholder.com/250x200'}" class="card-img">
            <div class="card-body">
                <h3 class="card-title" th:text="${item.nome}"></h3>
                <p class="card-author" th:text="${item.autor != null ? item.autor : 'Autor Desconhecido'}"></p>
                <span class="card-badge" th:text="${item.tipo != null ? item.tipo : 'Geral'}"></span>

                <div class="card-actions">
                    <form th:action="@{/itemAcervo/acessarItem/{id}(id=${item.id})}" method="post">
                        <button type="submit" class="btn-card">Detalhes</button>
                    </form>
                    <form th:action="@{/interesse/adicionar/{id}(id=${item.id})}" method="post" th:if="${session.usuarioLogado != null}">
                        <button type="submit" class="btn-card primary">Favoritar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
