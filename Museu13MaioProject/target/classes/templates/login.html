<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow-lg border-0" style="width: 400px; border-radius: 12px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-dark m-0">Login Interno</h2>
        <small class="text-muted">Insira suas credenciais do sistema</small>
    </div>

    <div th:if="${param.error}" class="alert alert-danger text-center p-2 small border-0" role="alert">
        E-mail ou senha incorretos.
    </div>

    <form th:action="@{/usuario/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-medium text-secondary">E-mail</label>
            <input type="email" name="email" class="form-control py-2" placeholder="seuemail@exemplo.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-medium text-secondary">Senha</label>
            <input type="password" name="senha" class="form-control py-2" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold shadow-sm">Entrar</button>
    </form>

    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none small text-muted">← Voltar para o início</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
